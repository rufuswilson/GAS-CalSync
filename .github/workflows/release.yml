name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish or upload again (for example, v1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify release tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Choose an existing v* release tag" >&2
            exit 1
          fi
          test -f "releases/$TAG_NAME.md" || {
            echo "Missing release notes for $TAG_NAME" >&2
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release files
        run: node --test tests/*.test.js
      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Configure Google authorization and release target
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          RELEASE_SCRIPT_ID: ${{ vars.GAS_project_ID }}
        run: |
          if [ -z "$CLASP_CREDENTIALS" ]; then
            echo "The CLASP_CREDENTIALS Actions secret is missing" >&2
            exit 1
          fi
          if [ -z "$RELEASE_SCRIPT_ID" ]; then
            echo "The GAS_project_ID Actions variable is missing" >&2
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e 'const fs = require("node:fs"); const id = process.env.RELEASE_SCRIPT_ID; if (!/^[A-Za-z0-9_-]+$/.test(id)) throw new Error("Invalid Release Script ID"); fs.writeFileSync(".clasp.json", JSON.stringify({ scriptId: id, rootDir: "." }) + "\n");'
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file "releases/$TAG_NAME.md"
      - name: Upload all release files to Apps Script
        run: clasp push --force
